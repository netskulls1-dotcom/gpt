name: Fresh50 V2 Independent Causal Research

on:
  push:
    paths:
      - 'payload_v2/**'
      - 'requirements.txt'
      - '.github/workflows/run_fresh50_research.yml'
  pull_request:
    paths:
      - 'trigger/run-v2-*'
      - 'payload_v2/**'
      - 'requirements.txt'
      - '.github/workflows/run_fresh50_research.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct frequency-safe independently tested runner
        shell: bash
        run: |
          cat payload_v2/part* | base64 --decode | gzip --decompress > fresh50_research.py
          echo '8e83628ca631f01f8f8e01000674173a3e1254fb548c770c852da84bb8da3466  fresh50_research.py' | sha256sum --check

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Restore Binance candle cache
        uses: actions/cache@v4
        with:
          path: .cache/binance_5m
          key: fresh50-binance-5m-v1

      - name: Offline self-test
        run: python fresh50_research.py --self-test

      - name: Run exact Top-50 V2 research
        run: >-
          python fresh50_research.py
          --output research_output
          --cache .cache/binance_5m
          --evaluation-days 365
          --warmup-days 70
          --oversample 75
          --download-workers 8
          --candle-cut-samples 16

      - name: Upload full V2 research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh50-independent-research-v2
          path: research_output/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish authoritative V2 result to repository
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          rm -rf published_result_v2
          mkdir -p published_result_v2
          if [ -d research_output ]; then
            cp -a research_output/. published_result_v2/
          else
            printf '%s\n' 'RUN_FAILED_BEFORE_OUTPUT' > published_result_v2/WORKFLOW_FAILURE.txt
          fi
          printf '%s\n' '${{ job.status }}' > published_result_v2/GITHUB_JOB_STATUS.txt
          printf '%s\n' '${{ github.sha }}' > published_result_v2/SOURCE_COMMIT_SHA.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' > published_result_v2/PUBLISHED_AT_UTC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f published_result_v2
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Fresh50 V2 independent causal research result'
            git push
          fi
