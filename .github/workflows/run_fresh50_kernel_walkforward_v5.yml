name: Fresh50 Kernel Walk-Forward Profit Research V5

on:
  pull_request:
    paths:
      - 'trigger/run-walkforward-v5-*'
      - 'patch_walkforward_v5/**'
      - 'payload_kernel/**'
      - 'requirements.txt'
      - '.github/workflows/run_fresh50_kernel_walkforward_v5.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify walk-forward profit runner
        shell: bash
        run: |
          cat payload_kernel/part* | base64 --decode | gzip --decompress > fresh50_kernel_research.py
          echo '8dcdf66b63069d99838b6fcadb0298072bd743d12632ee6f113aaeaed1a53915  fresh50_kernel_research.py' | sha256sum --check
          cat patch_walkforward_v5/part* | base64 --decode | gzip --decompress > walkforward_v5.patch
          patch -p0 < walkforward_v5.patch
          echo 'b21dfa73b1e9047472233a70bc1860f2f7a0eb89e410682bcf939b2d4fc43448  fresh50_kernel_research.py' | sha256sum --check

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Restore Binance candle cache
        uses: actions/cache@v4
        with:
          path: .cache/binance_5m
          key: fresh50-binance-5m-v1

      - name: Offline self-test
        run: python fresh50_kernel_research.py --self-test

      - name: Run one-year causal monthly walk-forward research
        run: >-
          python fresh50_kernel_research.py
          --output research_output
          --cache .cache/binance_5m
          --evaluation-days 365
          --warmup-days 70
          --oversample 75
          --download-workers 8
          --candle-cut-samples 32

      - name: Upload full V5 walk-forward artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh50-kernel-walkforward-v5
          path: research_output/
          if-no-files-found: warn
          retention-days: 30
