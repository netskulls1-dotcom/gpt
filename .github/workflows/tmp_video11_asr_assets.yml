name: Temporary Video 11 Whisper Model

on:
  push:
    branches:
      - tmp-video11-asr-assets-20260815
    paths:
      - '.github/workflows/tmp_video11_asr_assets.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify whisper.cpp small q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          curl -fL --retry 5 --retry-delay 2 \
            -o bundle/ggml-small-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin'
          echo 'ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  bundle/ggml-small-q5_1.bin' | sha256sum --check
          stat -c '%n %s bytes' bundle/ggml-small-q5_1.bin

      - name: Upload whisper model artifact
        uses: actions/upload-artifact@v4
        with:
          name: video11-whisper-small-q5_1
          path: bundle/ggml-small-q5_1.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
