name: Export Fresh50 V2 Research Runner

on:
  pull_request:
    paths:
      - 'export_trigger/**'
      - '.github/workflows/export_fresh50_runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct V2 runner
        shell: bash
        run: |
          mkdir -p runner_export
          cat payload_v2/part* | base64 --decode | gzip --decompress > runner_export/fresh50_research_v2.py
          echo '8e83628ca631f01f8f8e01000674173a3e1254fb548c770c852da84bb8da3466  runner_export/fresh50_research_v2.py' | sha256sum --check
          cp requirements.txt runner_export/requirements.txt

      - name: Upload V2 source artifact
        uses: actions/upload-artifact@v4
        with:
          name: fresh50-runner-source-v2
          path: runner_export/
          retention-days: 7
