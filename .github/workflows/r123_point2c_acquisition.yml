name: R123 Point2C Frozen Top50 Official Archive Acquisition

on:
  push:
    paths:
      - 'r123_point2c/**'
      - '.github/workflows/r123_point2c_acquisition.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  point2c:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct frozen R123 acquisition runner
        shell: bash
        run: |
          base64 --decode r123_point2c/acquire.py.gz.b64 | gzip --decompress > r123_point2c/acquire.py
          chmod +x r123_point2c/acquire.py
          echo 'f22147169f37fd77fb57f7c9e083387502250f366f972cb44ed4423f2c4743f3  r123_point2c/acquire.py' | sha256sum --check

      - name: Offline self-test
        run: python r123_point2c/acquire.py self-test

      - name: Probe all 1,200 frozen official archive units
        run: >-
          python r123_point2c/acquire.py preflight
          --output point2c_preflight
          --workers 32
          --retries 4
          --timeout 30

      - name: Read fail-closed acquisition gate
        id: gate
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open('point2c_preflight/R123_POINT2C_PREFLIGHT_SUMMARY.json', encoding='utf-8'))
          print('all_available=' + ('true' if p['all_1200_official_units_available'] else 'false'))
          print('available_units=' + str(p['available_units']))
          print('blocked_units=' + str(p['unavailable_or_failed_units']))
          PY

      - name: Download verify and normalize all 1,200 units
        if: steps.gate.outputs.all_available == 'true'
        run: >-
          python r123_point2c/acquire.py acquire
          --preflight point2c_preflight
          --output point2c_acquisition
          --workers 16
          --retries 4
          --timeout 90

      - name: Build normalized dataset checksum index
        if: steps.gate.outputs.all_available == 'true'
        shell: bash
        run: |
          find point2c_acquisition/normalized -type f -print0 | sort -z | xargs -0 sha256sum > point2c_acquisition/R123_NORMALIZED_DATASET_SHA256.txt
          du -sh point2c_acquisition/normalized > point2c_acquisition/R123_NORMALIZED_DATASET_SIZE.txt

      - name: Write workflow execution status
        if: always()
        shell: bash
        run: |
          mkdir -p point2c_workflow_status
          printf '%s\n' '${{ job.status }}' > point2c_workflow_status/GITHUB_JOB_STATUS.txt
          printf '%s\n' '${{ github.sha }}' > point2c_workflow_status/SOURCE_COMMIT_SHA.txt
          printf '%s\n' '${{ steps.gate.outputs.all_available }}' > point2c_workflow_status/ALL_1200_AVAILABLE.txt
          printf '%s\n' '${{ steps.gate.outputs.available_units }}' > point2c_workflow_status/AVAILABLE_UNITS.txt
          printf '%s\n' '${{ steps.gate.outputs.blocked_units }}' > point2c_workflow_status/BLOCKED_UNITS.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' > point2c_workflow_status/FINISHED_AT_UTC.txt

      - name: Upload Point2C official-inventory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r123-point2c-official-inventory
          path: |
            point2c_preflight/
            point2c_workflow_status/
            point2c_acquisition/R123_POINT2C_ACQUISITION_LEDGER.json
            point2c_acquisition/R123_POINT2C_ACQUISITION_LEDGER.csv
            point2c_acquisition/R123_POINT2C_ACQUISITION_SUMMARY.json
            point2c_acquisition/R123_NORMALIZED_DATASET_SHA256.txt
            point2c_acquisition/R123_NORMALIZED_DATASET_SIZE.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload normalized 1,200-unit dataset
        if: steps.gate.outputs.all_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r123-point2c-normalized-top50-six-tf
          path: point2c_acquisition/normalized/
          compression-level: 6
          if-no-files-found: error
          retention-days: 30

      - name: Publish authoritative Point2C report to repository
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          rm -rf published_result_r123_point2c
          mkdir -p published_result_r123_point2c
          if [ -d point2c_preflight ]; then cp -a point2c_preflight/. published_result_r123_point2c/; fi
          if [ -d point2c_workflow_status ]; then cp -a point2c_workflow_status/. published_result_r123_point2c/; fi
          if [ -f point2c_acquisition/R123_POINT2C_ACQUISITION_SUMMARY.json ]; then
            cp point2c_acquisition/R123_POINT2C_ACQUISITION_SUMMARY.json published_result_r123_point2c/
            cp point2c_acquisition/R123_NORMALIZED_DATASET_SHA256.txt published_result_r123_point2c/ 2>/dev/null || true
            cp point2c_acquisition/R123_NORMALIZED_DATASET_SIZE.txt published_result_r123_point2c/ 2>/dev/null || true
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f published_result_r123_point2c
          if ! git diff --cached --quiet; then
            git commit -m 'Publish R123 Point2C official archive inventory result'
            git push
          fi
